name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect demo-only push
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — will publish to npm."
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No previous SHA — will publish to npm."
            exit 0
          fi

          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          if [ -z "$changed" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No changed files — skipping npm publish."
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              demo/*) ;;
              *)
                echo "publish=true" >> "$GITHUB_OUTPUT"
                echo "Non-demo changes detected — will publish to npm."
                exit 0
                ;;
            esac
          done <<< "$changed"

          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "Demo-only changes — skipping npm publish."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build library and demo
        run: npm run build:demo
        env:
          BASE_PATH: /touchable/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo/dist

      - name: Bump version if already on npm
        if: steps.release.outputs.publish == 'true'
        run: |
          PKG="@palashjain95/touchable"
          while npm view "${PKG}@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; do
            echo "Version $(node -p "require('./package.json').version") already published; bumping patch"
            npm version patch --no-git-tag-version
          done
          echo "Publishing $(node -p "require('./package.json').version")"

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        run: |
          npm install -g npm@11
          npm publish --access public

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build library and demo
        run: npm run build:demo
        env:
          BASE_PATH: /touchable/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo/dist

      - name: Bump version if already on npm
        run: |
          PKG="@palashjain95/touchable"
          while npm view "${PKG}@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; do
            echo "Version $(node -p "require('./package.json').version") already published; bumping patch"
            npm version patch --no-git-tag-version
          done
          echo "Publishing $(node -p "require('./package.json').version")"

      - name: Publish to npm
        run: |
          npm install -g npm@11
          npm publish --access public
